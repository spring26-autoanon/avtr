model:
  checkpoint: base
  generation:
    cfg_coef: 1.0
    stt_wait_time: 0.5
    rag_timeout: 8.0
    max_reference_tokens: 64
    vad_window_size: 4
    vad_threshold: 0.5
    power_threshold: -65
    tail_silence_steps: 25
    # See configs/baseline_with_retrieval.yaml's matching comment —
    # unchanged from LMGen's own hardcoded defaults. The pad-token-sampling
    # drift these two are a lever on (CLAUDE.md's "Real root cause of demo
    # response lag") is confirmed present even without retrieval, so this
    # config gets the same knobs.
    temp_text: 0.7
    top_k_text: 25
  retrieval:
    enabled: false

judge:
  model: gemini-3.5-flash

tts:
  backend: gemini_tts          # key into configs/tts_backends.yaml — used by knowledge.gsm8k

evals:
  - knowledge.open_audio_bench
  - knowledge.halu_eval_audio
  - knowledge.gsm8k
  - duplex.full_duplex_bench
  - latency.ttfat
  - latency.retrieval_breakdown

output_dir: ./evals/results/
