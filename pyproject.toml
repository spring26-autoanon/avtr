[project]
name = "moshirag-evals"
version = "0.1.0"
requires-python = ">=3.10"
# Core deps work everywhere (no torch). GPU deps installed on the VM via `uv sync --extra gpu`.
dependencies = [
    "huggingface-hub",
    "google-genai",
    "google-cloud-storage",
    "pyyaml",
    "python-dotenv",
    "numpy",
    "datasets",
]

[project.optional-dependencies]
# VM only — torch has no musl/Alpine wheels
gpu = [
    "torch",
    "torchaudio",
    "transformers",
    "speechbrain",
    "openai-whisper",
    "sounddevice",
]
dev = [
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "evals", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
