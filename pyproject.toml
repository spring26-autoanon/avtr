[project]
name = "moshirag-evals"
version = "0.1.0"
requires-python = ">=3.10"
# Core deps work everywhere (no torch). GPU deps installed on the VM via `uv sync --extra gpu`.
dependencies = [
    "huggingface-hub",
    "google-genai",
    "google-cloud-storage",
    "pyyaml",
    "python-dotenv",
    "numpy",
    "datasets",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
]

[project.optional-dependencies]
# VM only — torch has no musl/Alpine wheels
gpu = [
    # Pinned exactly: moshi's git install pulls in xformers==0.0.33.post2,
    # which itself exactly pins torch==2.9.1. Left unpinned, `uv sync` picks
    # whatever's newest (e.g. 2.13.0) here, then moshi's separate `uv pip
    # install` downgrades torch to satisfy xformers but never cleans up the
    # newer version's now-orphaned nvidia-*-cuXX packages — the two CUDA
    # generations coexisting then breaks torch's own native library loading
    # (ImportError: undefined symbol: ncclCommResume). Pinning here up front
    # means both install steps agree from the start. torchaudio pinned to
    # match — torchaudio and torch from different releases aren't compatible
    # per https://docs.pytorch.org/audio/stable/installation.html.
    "torch==2.9.1",
    "torchaudio==2.9.1",
    # >=4.57.1 required: AutoTokenizer.from_pretrained() crashes on repos with
    # no additional_chat_templates/ folder (most repos, incl. Llama-3.2) on
    # 4.52-4.57.0 — https://github.com/huggingface/transformers/issues/41813
    # <5 caps it to the same major line moshi was built against — avoid an
    # unintended major-version jump on top of an already-narrow fix.
    "transformers>=4.57.1,<5",
    "speechbrain",
    "faster-whisper",
    # moshi installed separately on VM — see make install
    # (git dep pulls aiohttp which needs cc, absent in dev container)
]
dev = [
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["core", "evals", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
